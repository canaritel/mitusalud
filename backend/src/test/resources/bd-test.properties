# Configuración de los tests con base de datos (clases *IT).
# La carga la anotación @UsaBaseDeDatosDeTest mediante @TestPropertySource, que tiene más prioridad
# que las variables de entorno: aunque exista SPRING_DATASOURCE_URL, los tests usan esta dirección.
# Base de datos separada de la de desarrollo; usuario y contraseña salen del .env.
spring.datasource.url=jdbc:postgresql://localhost:5433/mitusalud_test
