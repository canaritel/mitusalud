spring.application.name=mitusalud

# --- Base de datos ---
# Lee el .env de la raíz del proyecto como si fuera un archivo de propiedades.
# "optional:" evita que la aplicación falle si el archivo no existe (por ejemplo, en un servidor
# donde la contraseña llega como variable de entorno).
# La ruta es relativa a la carpeta desde la que se arranca: arranca siempre desde backend/.
spring.config.import=optional:file:../.env[.properties]

# localhost:5433 es el extremo local del túnel SSH hacia el servidor.
# Cualquiera de estos valores se puede sobrescribir con variables de entorno
# (por ejemplo SPRING_DATASOURCE_URL), sin tocar este archivo.
spring.datasource.url=jdbc:postgresql://localhost:5433/mitusalud
spring.datasource.username=mitusalud
spring.datasource.password=${POSTGRES_PASSWORD}

# Cuando PostgreSQL rechaza una fila, su error incluye la fila entera ("Failing row contains
# (..., nota)") y Hibernate la escribe en el log. Con esto el driver deja solo el error y el
# nombre de la restricción, sin valores (L-07). Lo vigila EnergiaRepositoryIT.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Flyway crea y modifica las tablas. Hibernate solo comprueba que las entidades
# coinciden con ellas y se niega a arrancar si no es así; nunca cambia el esquema.
spring.jpa.hibernate.ddl-auto=validate

# Desactiva "Open Session in View": las consultas a la base de datos se hacen en el service,
# nunca de forma oculta mientras se genera la respuesta HTTP.
spring.jpa.open-in-view=false

# --- Web ---
# Mientras no haya login, el backend solo acepta conexiones desde este mismo equipo.
# Al desplegar en Docker se cambiará con la variable de entorno SERVER_ADDRESS.
server.address=127.0.0.1

# Hilos virtuales de Java 21: atienden muchas peticiones a la vez sin cambiar el código.
spring.threads.virtual.enabled=true

# Por defecto, Jackson convierte un decimal en entero truncándolo sin avisar ("250.5" -> 250).
# Se desactiva: un decimal donde se espera un entero se rechaza con 400 (docs/MODELO_DATOS.md, pieza 7).
spring.jackson.deserialization.accept-float-as-int=false

# --- Acceso del propietario (docs/STACK.md, "Identidad") ---
# Dominio de WebAuthn (rpId): el de la instalación. En desarrollo, localhost: WebAuthn no admite IPs.
mitusalud.acceso.dominio=localhost
# Dirección con la que se abre la pantalla: el único origen desde el que se aceptan passkeys.
mitusalud.acceso.origen=http://localhost:5173

# Sesiones en PostgreSQL (Spring Session JDBC), para que el comando "acceso" pueda cerrarlas.
# Las tablas las crea Flyway (V6), no Spring.
spring.session.jdbc.initialize-schema=never
# Caduca tras 8 horas sin uso. La cookie no es legible desde JavaScript, solo viaja por HTTPS
# (los navegadores también la aceptan en http://localhost) y no se envía desde otros sitios.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Los errores de la API se devuelven en formato estándar ProblemDetail (RFC 9457).
# Lo hace comun/ManejadorErroresApi, que además indica qué campos fallan.

# --- Idioma ---
# Español e inglés según la cabecera Accept-Language; ver comun/ConfiguracionIdioma.
# Textos propios: messages.properties (español) y messages_en.properties (inglés).
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# --- Actuator ---
# Solo se publica /actuator/health, que indica si la aplicación y la base de datos están bien.
management.endpoints.web.exposure.include=health
