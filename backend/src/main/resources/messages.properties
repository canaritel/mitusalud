# Textos de la API en español (idioma por defecto).
# Las claves problemDetail.* son las que Spring busca para el título y el detalle de cada error.

# Validación fallida (@Valid)
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Petición no válida
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Hay campos con valores no válidos.

# El cuerpo de la petición no es un JSON válido o tiene tipos incorrectos
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Petición no válida
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=El cuerpo de la petición no es un JSON válido o tiene valores del tipo equivocado.

# Mensajes de validación propios: se usan con message = "{clave}" en las anotaciones de los DTOs.
# Los mensajes estándar ("no debe ser nulo") ya vienen traducidos en Hibernate Validator.
validacion.texto.caracteresNoValidos=contiene caracteres no válidos

# Falta la cabecera Idempotency-Key, o su valor no es un UUID ({0} es el nombre de la cabecera)
problemDetail.title.org.springframework.web.bind.MissingRequestHeaderException=Petición no válida
problemDetail.org.springframework.web.bind.MissingRequestHeaderException=Falta la cabecera {0}.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Petición no válida
problemDetail.org.springframework.beans.TypeMismatchException=El valor de {0} no es válido.

# La clave de idempotencia ya se usó con otros datos (422)
problemDetail.title.io.github.canaritel.mitusalud.diario.service.ClaveIdempotenciaReutilizadaException=Clave ya usada
problemDetail.io.github.canaritel.mitusalud.diario.service.ClaveIdempotenciaReutilizadaException=Esta clave de idempotencia ya se usó con otros datos. Un registro nuevo necesita una clave nueva.
